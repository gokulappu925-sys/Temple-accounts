<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temple Accounting &amp; Fund Management</title>
<style>
:root {
  --maroon: #800000;
  --maroon-dark: #5c0000;
  --gold: #b8860b;
  --bg: #f4f6f9;
  --card: #ffffff;
  --border: #e1e1e1;
  --text: #2b2b2b;
  --text-muted: #666;
  --green: #1e8e3e;
  --red: #c62828;
  --amber: #a06a00;
  --radius: 10px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

#app-shell { display: flex; min-height: 100vh; }

/* SIDEBAR */
#sidebar {
  width: 240px;
  flex-shrink: 0;
  background: var(--maroon-dark);
  color: #fff;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px; border-bottom: 1px solid rgba(255,255,255,.15); }
.brand-icon { font-size: 26px; }
.brand-text #brand-name { font-weight: bold; font-size: 14px; line-height: 1.3; }
.brand-fy { font-size: 11px; opacity: .75; }
#nav { display: flex; flex-direction: column; padding: 10px; gap: 2px; }
.nav-item {
  text-align: left;
  background: none;
  border: none;
  color: #f1e4e4;
  padding: 10px 12px;
  border-radius: 7px;
  font-size: 13.5px;
  cursor: pointer;
}
.nav-item:hover { background: rgba(255,255,255,.10); }
.nav-item.active { background: var(--maroon); color: #fff; font-weight: bold; }

/* MAIN */
#main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#topbar {
  background: #fff;
  border-bottom: 1px solid var(--border);
  padding: 12px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 5;
}
#topbar-title { font-size: 19px; font-weight: bold; color: var(--maroon); }
#topbar-right { display: flex; align-items: center; gap: 12px; }
#globalSearch { padding: 8px 12px; border: 1px solid var(--border); border-radius: 7px; width: 280px; font-size: 13px; }
.db-status { color: var(--green); font-size: 10px; }

#app-main { padding: 22px; }
.loading { color: var(--text-muted); padding: 40px; text-align: center; }

/* CARDS */
.card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 20px; }
.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
}
.stat-card .stat-label { font-size: 12.5px; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }
.stat-card .stat-value { font-size: 22px; font-weight: bold; color: var(--maroon); }
.stat-card.accent-green .stat-value { color: var(--green); }
.stat-card.accent-red .stat-value { color: var(--red); }
.stat-card.accent-amber .stat-value { color: var(--amber); }

.quick-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
.quick-actions button { flex: 0 0 auto; }

.panel-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 900px) { .panel-row { grid-template-columns: 1fr; } }

.panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
}
.panel h3 { margin: 0 0 12px; font-size: 15px; color: var(--maroon); }

/* FORMS */
.form-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 20px;
}
.form-card h3 { margin: 0 0 14px; color: var(--maroon); }
.form-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }
@media (max-width: 900px) { .form-row { grid-template-columns: 1fr; } }
.form-group label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background: #fff;
}
.form-actions { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; }

button, .btn {
  padding: 10px 16px; border: none; border-radius: 7px; background: var(--maroon); color: #fff;
  font-size: 13.5px; font-weight: 600; cursor: pointer;
}
button:hover { opacity: .92; }
.btn-sec { background: #17707f; }
.btn-green { background: var(--green); }
.btn-outline { background: #fff; color: var(--maroon); border: 1px solid var(--maroon); }
.btn-danger { background: var(--red); }
.btn-sm { padding: 6px 10px; font-size: 12px; }

/* TABLES */
.table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 9px 10px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
th { background: #faf5f5; color: var(--maroon); font-size: 12px; text-transform: uppercase; letter-spacing: .3px; }
tr.voided { opacity: .5; text-decoration: line-through; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.pill.cash { background: #e6f4ea; color: var(--green); }
.pill.bank { background: #e6f0fa; color: #1a56db; }
.pill.upi { background: #f3e8ff; color: #7e22ce; }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.toolbar input, .toolbar select { padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
.section-title { font-size: 20px; font-weight: bold; color: var(--maroon); margin: 0 0 16px; }
.muted { color: var(--text-muted); font-size: 12.5px; }
.balance-banner {
  background: #fff3cd; border: 1px solid #ffe08a; border-radius: var(--radius);
  padding: 12px 16px; margin-bottom: 16px; font-weight: 600; color: #6b5000;
}
.balance-banner.ok { background: #e6f4ea; border-color: #b6e2c3; color: #1e5a30; }
.balance-banner.bad { background: #fdecea; border-color: #f6c4bf; color: #8a2119; }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px;
}
.modal-box { background: #fff; border-radius: var(--radius); padding: 24px; max-width: 480px; width: 100%; max-height: 85vh; overflow-y: auto; }
.modal-box h3 { margin-top: 0; color: var(--maroon); }

@media (max-width: 860px) {
  #sidebar { width: 72px; }
  .brand-text, .nav-item { font-size: 0; }
  .brand-icon { font-size: 24px; }
  .nav-item { font-size: 20px; text-align: center; }
  #globalSearch { width: 160px; }
}

/* PRINT */
#print-area { display: none; }
@media print {
  body * { visibility: hidden; }
  #print-area, #print-area * { visibility: visible; }
  #print-area { display: block !important; position: absolute; left: 0; top: 0; width: 100%; }
  #print-area.receipt-print { width: 72mm; font-family: monospace; font-size: 11px; padding: 4mm; }
  #print-area.a4-print { width: 190mm; padding: 8mm; font-size: 12px; }
  .pr-line { border-bottom: 1px dashed #000; margin: 5px 0; }
  .pr-center { text-align: center; }
  .pr-bold { font-weight: bold; }
  .pr-flex { display: flex; justify-content: space-between; }
  .pr-table { width: 100%; border-collapse: collapse; }
  .pr-table th, .pr-table td { border: 1px solid #000; padding: 4px 6px; font-size: 11px; }
}

</style>
</head>
<body>

<div id="app-shell">

  <aside id="sidebar">
    <div class="brand">
      <div class="brand-icon">🛕</div>
      <div class="brand-text">
        <div id="brand-name">Temple Accounts</div>
        <div id="brand-fy" class="brand-fy"></div>
      </div>
    </div>
    <nav id="nav">
      <button class="nav-item active" data-view="dashboard">🏠 Dashboard</button>
      <button class="nav-item" data-view="receipts">💰 Receipts</button>
      <button class="nav-item" data-view="payments">💸 Payments</button>
      <button class="nav-item" data-view="cashbook">💵 Cash Book</button>
      <button class="nav-item" data-view="bankbook">🏦 Bank Book</button>
      <button class="nav-item" data-view="ledger">📒 Ledger</button>
      <button class="nav-item" data-view="vazhipadu">🙏 Vazhipadu</button>
      <button class="nav-item" data-view="punarudharanam">🏗️ Punarudharanam Fund</button>
      <button class="nav-item" data-view="chitty">🪙 Chitty</button>
      <button class="nav-item" data-view="loans">💳 Loans</button>
      <button class="nav-item" data-view="transfers">🔄 Fund Transfers</button>
      <button class="nav-item" data-view="reports">📊 Reports</button>
      <button class="nav-item" data-view="trialbalance">⚖️ Trial Balance</button>
      <button class="nav-item" data-view="settings">⚙️ Settings</button>
      <button class="nav-item" data-view="backup">💾 Backup &amp; Restore</button>
    </nav>
  </aside>

  <div id="main-col">
    <header id="topbar">
      <div id="topbar-title">Dashboard</div>
      <div id="topbar-right">
        <input type="text" id="globalSearch" placeholder="🔍 Search receipt no, name, amount..." onkeydown="if(event.key==='Enter') runGlobalSearch()">
        <span id="dbStatus" class="db-status">●</span>
      </div>
    </header>
    <main id="app-main"><div class="loading">Loading…</div></main>
  </div>

</div>

<div id="modal-root"></div>
<div id="print-area"></div>

<script>
/* ===========================================================
   TEMPLE ACCOUNTING & FUND MANAGEMENT — app.js
   Offline-first, IndexedDB-backed. No server, no internet needed.
   =========================================================== */

const DB_NAME = 'temple_accounts_db';
const DB_VERSION = 1;
const STORES = ['settings','funds','incomeCategories','expenseCategories','bankAccounts',
  'receipts','payments','transfers','chittyMembers','chittyCollections','chittyPayouts','loans'];

let db = null;
let CURRENT_VIEW = 'dashboard';

/* ---------- DB LAYER ---------- */
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', { keyPath: 'id' });
      ['funds','incomeCategories','expenseCategories','bankAccounts','receipts','payments',
       'transfers','chittyMembers','chittyCollections','chittyPayouts','loans'].forEach(name => {
        if (!d.objectStoreNames.contains(name)) d.createObjectStore(name, { keyPath: 'id', autoIncrement: true });
      });
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e.target.error);
  });
}
function storeTx(name, mode = 'readonly') { return db.transaction(name, mode).objectStore(name); }
function getAll(name) { return new Promise((res, rej) => { const r = storeTx(name).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function getOne(name, id) { return new Promise((res, rej) => { const r = storeTx(name).get(id); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function addRec(name, obj) { return new Promise((res, rej) => { const r = storeTx(name, 'readwrite').add(obj); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function putRec(name, obj) { return new Promise((res, rej) => { const r = storeTx(name, 'readwrite').put(obj); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function deleteRec(name, id) { return new Promise((res, rej) => { const r = storeTx(name, 'readwrite').delete(id); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }
function clearStore(name) { return new Promise((res, rej) => { const r = storeTx(name, 'readwrite').clear(); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }

/* ---------- DEFAULTS / SEED ---------- */
const DEFAULT_EXPENSE_CATEGORIES = [
  'Flower','Oil','Camphor','Incense','Pooja Materials','Milk','Fruits','Vegetables','Payasam','Food','Water',
  'Electricity','Gas','Cleaning Materials','Cleaning Charges',
  'Building Repair','Roof Repair','Electrical Repair','Plumbing Repair','Painting','Carpentry','Mason Work',
  'General Maintenance','Equipment Repair','Garden Maintenance',
  'Salary','Priest Payment','Cleaning Staff','Security','Festival Labour','Other Service Charges',
  'Chenda','Melam','Decoration','Lighting','Sound System','Printing','Advertisement','Annadanam',
  'Transportation','Temporary Labour','Festival Materials',
  'Stationery','Receipt Books','Registers','Computer Expense','Internet','Telephone','Bank Charges','Postage','Travel','Office Expense',
  'Archana Materials','Garland','Naivedyam','Special Pooja Expense',
  'Cement','Sand','Stone','Bricks','Tiles','Wood','Roofing','Doors','Windows','Labour','Contractor','Equipment Hire',
  'Emergency Expense','Miscellaneous','Other'
];
const DEFAULT_INCOME_CATEGORIES = ['Pooja Income','Archana Income','Vazhipadu Income','Donation Income','Festival Collection','General Contribution','Other Income'];
const DEFAULT_FUNDS = ['General Temple Fund','Punarudharanam Fund','Chitty Fund','Festival Fund','Donation / Restricted Fund','Other Fund'];

async function seedIfNeeded() {
  const existing = await getOne('settings', 1);
  if (existing) { window.APP_SETTINGS = existing; return; }
  const settings = {
    id: 1,
    templeName: 'മറുതാ ചാമുണ്ഡി ദേവി ക്ഷേത്രം',
    address: 'ആശാരിവിളാകം കേരളദിത്യപുരം',
    phone: '', email: '',
    receiptPrefix: 'R-', voucherPrefix: 'V-',
    financialYear: financialYearLabel(new Date()),
    currencySymbol: '₹',
    receiptCounter: 1001,
    voucherCounter: 501,
    startDate: new Date().toISOString().slice(0,10),
    openingCash: 0, openingBank: 0,
    openingGeneralFund: 0, openingPunarudharanamFund: 0,
    openingChittyBalance: 0, openingLoans: 0
  };
  await putRec('settings', settings);
  window.APP_SETTINGS = settings;
  for (const name of DEFAULT_FUNDS) await addRec('funds', { name });
  for (const name of DEFAULT_INCOME_CATEGORIES) await addRec('incomeCategories', { name });
  for (const name of DEFAULT_EXPENSE_CATEGORIES) await addRec('expenseCategories', { name });
  await addRec('bankAccounts', { name: 'Canara Bank', isDefault: true });
}

/* ---------- SMALL HELPERS ---------- */
function fmtMoney(n) { const s = window.APP_SETTINGS; const sym = (s && s.currencySymbol) || '₹'; const v = parseFloat(n) || 0; return sym + v.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtDate(iso) { if (!iso) return '-'; const [y,m,d] = iso.split('-'); return `${d}-${m}-${y}`; }
function todayISO() { return new Date().toISOString().slice(0,10); }
function financialYearLabel(d) { const y = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1; return `${y}-${String((y+1)).slice(2)}`; }
function sumField(arr, field) { return arr.reduce((s,x) => s + (parseFloat(x[field]) || 0), 0); }
function notVoided(arr) { return arr.filter(x => !x.voided); }
function esc(str) { return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function el(id) { return document.getElementById(id); }
function qs(sel, root) { return (root || document).querySelector(sel); }
function qsa(sel, root) { return Array.from((root || document).querySelectorAll(sel)); }
function optsFromNames(arr, selected) { return arr.map(x => `<option value="${esc(x.name)}" ${x.name===selected?'selected':''}>${esc(x.name)}</option>`).join(''); }
function optSel(value, selected) { return `<option value="${esc(value)}" ${value===selected?'selected':''}>${esc(value)}</option>`; }
/* Generic hard-delete used by every entry type's Delete button. */
async function deleteRecord(store, id, viewName, ...args) {
  if (!confirm('Delete this entry permanently? This cannot be undone.')) return;
  await deleteRec(store, id);
  await navigate(viewName || CURRENT_VIEW, ...args);
}

async function nextReceiptNo() {
  const s = window.APP_SETTINGS;
  const no = s.receiptPrefix + s.receiptCounter;
  return no;
}
async function bumpReceiptCounter() {
  const s = window.APP_SETTINGS;
  s.receiptCounter = (parseInt(s.receiptCounter) || 1000) + 1;
  await putRec('settings', s);
}
async function nextVoucherNo() {
  const s = window.APP_SETTINGS;
  return s.voucherPrefix + s.voucherCounter;
}
async function bumpVoucherCounter() {
  const s = window.APP_SETTINGS;
  s.voucherCounter = (parseInt(s.voucherCounter) || 500) + 1;
  await putRec('settings', s);
}

/* ---------- DATA ACCESSORS ---------- */
async function allReceipts() { return await getAll('receipts'); }
async function allPayments() { return await getAll('payments'); }
async function activeReceipts() { return notVoided(await allReceipts()); }
async function activePayments() { return notVoided(await allPayments()); }
async function allTransfers() { return await getAll('transfers'); }
async function allLoans() { return await getAll('loans'); }
async function allChittyCollections() { return await getAll('chittyCollections'); }
async function allChittyPayouts() { return await getAll('chittyPayouts'); }
async function allChittyMembers() { return await getAll('chittyMembers'); }
async function allFunds() { return await getAll('funds'); }
async function allIncomeCategories() { return await getAll('incomeCategories'); }
async function allExpenseCategories() { return await getAll('expenseCategories'); }
async function allBankAccounts() { return await getAll('bankAccounts'); }

/* ---------- BALANCE ENGINE ---------- */
async function getCashBalance(uptoDate) {
  const s = window.APP_SETTINGS;
  const [receipts, payments, transfers, loans, collections, payouts] = await Promise.all([
    activeReceipts(), activePayments(), allTransfers(), allLoans(), allChittyCollections(), allChittyPayouts()
  ]);
  const inRange = (arr) => uptoDate ? arr.filter(x => x.date <= uptoDate) : arr;
  let bal = parseFloat(s.openingCash) || 0;
  bal += sumField(inRange(receipts).filter(r => r.paymentMode === 'Cash'), 'amount');
  bal -= sumField(inRange(payments).filter(p => p.paymentMode === 'Cash'), 'amount');
  bal += sumField(inRange(loans).filter(l => l.paymentMode === 'Cash'), 'loanReceived');
  bal -= sumField(inRange(loans).filter(l => l.paymentMode === 'Cash'), 'repayment');
  bal += sumField(inRange(collections).filter(c => c.paymentMode === 'Cash'), 'amountReceived');
  bal -= sumField(inRange(payouts).filter(p => p.paymentMode === 'Cash'), 'amount');
  inRange(transfers).forEach(t => {
    if (t.fromAcc === 'Cash') bal -= parseFloat(t.amount) || 0;
    if (t.toAcc === 'Cash') bal += parseFloat(t.amount) || 0;
  });
  return bal;
}
async function getBankBalance(uptoDate) {
  const s = window.APP_SETTINGS;
  const [receipts, payments, transfers, loans, collections, payouts] = await Promise.all([
    activeReceipts(), activePayments(), allTransfers(), allLoans(), allChittyCollections(), allChittyPayouts()
  ]);
  const inRange = (arr) => uptoDate ? arr.filter(x => x.date <= uptoDate) : arr;
  const isBankMode = (mode) => mode === 'Bank' || mode === 'UPI';
  let bal = parseFloat(s.openingBank) || 0;
  bal += sumField(inRange(receipts).filter(r => isBankMode(r.paymentMode)), 'amount');
  bal -= sumField(inRange(payments).filter(p => isBankMode(p.paymentMode)), 'amount');
  bal += sumField(inRange(loans).filter(l => isBankMode(l.paymentMode)), 'loanReceived');
  bal -= sumField(inRange(loans).filter(l => isBankMode(l.paymentMode)), 'repayment');
  bal += sumField(inRange(collections).filter(c => isBankMode(c.paymentMode)), 'amountReceived');
  bal -= sumField(inRange(payouts).filter(p => isBankMode(p.paymentMode)), 'amount');
  inRange(transfers).forEach(t => {
    if (t.fromAcc === 'Bank') bal -= parseFloat(t.amount) || 0;
    if (t.toAcc === 'Bank') bal += parseFloat(t.amount) || 0;
  });
  return bal;
}
async function getFundBalance(fundName, uptoDate) {
  const s = window.APP_SETTINGS;
  const [receipts, payments, collections, payouts] = await Promise.all([
    activeReceipts(), activePayments(), allChittyCollections(), allChittyPayouts()
  ]);
  const inRange = (arr) => uptoDate ? arr.filter(x => x.date <= uptoDate) : arr;
  let opening = 0;
  if (fundName === 'General Temple Fund') opening = parseFloat(s.openingGeneralFund) || 0;
  if (fundName === 'Punarudharanam Fund') opening = parseFloat(s.openingPunarudharanamFund) || 0;
  if (fundName === 'Chitty Fund') opening = parseFloat(s.openingChittyBalance) || 0;
  let bal = opening;
  bal += sumField(inRange(receipts).filter(r => r.fund === fundName), 'amount');
  bal -= sumField(inRange(payments).filter(p => p.fund === fundName), 'amount');
  if (fundName === 'Chitty Fund') {
    bal += sumField(inRange(collections), 'amountReceived');
    bal -= sumField(inRange(payouts), 'amount');
  }
  return bal;
}
async function getAllFundBalances(uptoDate) {
  const funds = await allFunds();
  const out = [];
  for (const f of funds) out.push({ name: f.name, balance: await getFundBalance(f.name, uptoDate) });
  return out;
}
async function getLoanOutstanding() {
  const s = window.APP_SETTINGS;
  const loans = await allLoans();
  let bal = parseFloat(s.openingLoans) || 0;
  bal += sumField(loans, 'loanReceived');
  bal -= sumField(loans, 'repayment');
  return bal;
}
async function getChittyOutstanding() {
  const members = await allChittyMembers();
  const collections = await allChittyCollections();
  let totalDue = 0, totalPaid = sumField(collections, 'amountReceived');
  members.forEach(m => {
    const paidInstallments = collections.filter(c => c.memberId === m.id).length;
    // rough due estimate: installmentAmount * number of collections logged for that member is already paid;
    // outstanding isn't computable without a fixed installment count, so report totals only.
  });
  return { totalPaid, memberCount: members.length };
}
async function monthIncomeExpense(monthStart, monthEnd) {
  const receipts = (await activeReceipts()).filter(r => r.date >= monthStart && r.date <= monthEnd);
  const payments = (await activePayments()).filter(p => p.date >= monthStart && p.date <= monthEnd);
  return { income: sumField(receipts, 'amount'), expense: sumField(payments, 'amount') };
}

/* ---------- ROUTER ---------- */

async function saveReceipt(print) {
  const form = el('receiptForm');
  const fd = new FormData(form);
  const amount = parseFloat(fd.get('amount'));
  const receiptNo = (fd.get('receiptNo') || '').trim();
  const editId = fd.get('editId') ? parseInt(fd.get('editId')) : null;
  if (!receiptNo || !fd.get('name') || !fd.get('date') || !fd.get('fund') || !amount || amount <= 0) {
    alert('Please fill all required fields (including Receipt Number) with a valid amount.'); return;
  }
  const existing = await allReceipts();
  if (existing.some(r => r.receiptNo === receiptNo && !r.voided && r.id !== editId)) {
    alert('Receipt Number "' + receiptNo + '" is already in use. Please enter a different number.'); return;
  }
  const rec = {
    receiptNo, date: fd.get('date'), name: fd.get('name'), mobile: fd.get('mobile') || '',
    fund: fd.get('fund'), category: fd.get('category') || 'Uncategorized', description: fd.get('description') || '',
    paymentMode: fd.get('paymentMode'), bankAccount: fd.get('bankAccount') || '', amount,
    remarks: fd.get('remarks') || ''
  };
  let id;
  if (editId) {
    const prior = await getOne('receipts', editId);
    rec.voided = prior ? prior.voided : false;
    rec.voidReason = prior ? prior.voidReason : undefined;
    rec.voidDate = prior ? prior.voidDate : undefined;
    rec.createdAt = prior ? prior.createdAt : Date.now();
    rec.id = editId;
    await putRec('receipts', rec);
    id = editId;
  } else {
    rec.voided = false; rec.createdAt = Date.now();
    id = await addRec('receipts', rec);
    await bumpReceiptCounter();
  }
  await refreshSettings();
  await navigate('receipts');
  if (print) printReceipt({ ...rec, id });
}

    <div class="pr-center pr-bold" style="margin-top:6px;">*** അമ്മേ നാരായണ ദേവി നാരായണ ***</div>
  `;

function amountInWords(n) {
  n = Math.round(parseFloat(n) || 0);
  if (n === 0) return 'Zero Rupees only';
  const a = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function two(x) { if (x < 20) return a[x]; return b[Math.floor(x/10)] + (x%10 ? ' ' + a[x%10] : ''); }
  function three(x) { if (x < 100) return two(x); return a[Math.floor(x/100)] + ' Hundred' + (x%100 ? ' ' + two(x%100) : ''); }
  let str = '';
  const crore = Math.floor(n / 10000000); n %= 10000000;
  const lakh = Math.floor(n / 100000); n %= 100000;
  const thousand = Math.floor(n / 1000); n %= 1000;
  const hundred = n;
  if (crore) str += three(crore) + ' Crore ';
  if (lakh) str += three(lakh) + ' Lakh ';
  if (thousand) str += three(thousand) + ' Thousand ';
  if (hundred) str += three(hundred);
  return (str.trim() || 'Zero') + ' Rupees only';
}

    rec.createdAt = prior ? prior.createdAt : Date.now();
    rec.id = editId;
    await putRec('payments', rec);
    id = editId;
  } else {
    rec.voided = false; rec.createdAt = Date.now();
    id = await addRec('payments', rec);
    await bumpVoucherCounter();
  }
  await refreshSettings();
  await navigate('payments');
  if (print) printVoucher({ ...rec, id });
}

/* ===================== CASH BOOK / BANK BOOK ===================== */
async function buildCashBookRows() {
  const s = window.APP_SETTINGS;
  const [receipts, payments, transfers, loans, collections, payouts] = await Promise.all([
    activeReceipts(), activePayments(), allTransfers(), allLoans(), allChittyCollections(), allChittyPayouts()
  ]);
  const rows = [];
  receipts.filter(r=>r.paymentMode==='Cash').forEach(r => rows.push({ date:r.date, particulars:`Receipt ${r.receiptNo} - ${r.name}`, receipt:r.amount, payment:0 }));
  payments.filter(p=>p.paymentMode==='Cash').forEach(p => rows.push({ date:p.date, particulars:`Payment ${p.voucherNo} - ${p.paidTo}`, receipt:0, payment:p.amount }));
  loans.filter(l=>l.paymentMode==='Cash').forEach(l => { if (l.loanReceived) rows.push({ date:l.date, particulars:`Loan Received - ${l.person}`, receipt:l.loanReceived, payment:0 }); if (l.repayment) rows.push({ date:l.date, particulars:`Loan Repayment - ${l.person}`, receipt:0, payment:l.repayment }); });
  collections.filter(c=>c.paymentMode==='Cash').forEach(c => rows.push({ date:c.date, particulars:`Chitty Collection - ${c.memberName||''}`, receipt:c.amountReceived, payment:0 }));
  payouts.filter(p=>p.paymentMode==='Cash').forEach(p => rows.push({ date:p.date, particulars:`Chitty Payout - ${p.memberName||''}`, receipt:0, payment:p.amount }));
  transfers.forEach(t => {
    if (t.fromAcc==='Cash') rows.push({ date:t.date, particulars:`Transfer to Bank via ${t.mode||'Cash'}${t.reason?' ('+t.reason+')':''}`, receipt:0, payment:t.amount });
    if (t.toAcc==='Cash') rows.push({ date:t.date, particulars:`Transfer from Bank via ${t.mode||'Cash'}${t.reason?' ('+t.reason+')':''}`, receipt:t.amount, payment:0 });
  });
  rows.sort((a,b) => a.date.localeCompare(b.date));
  let bal = parseFloat(s.openingCash) || 0;
  return rows.map(r => { bal += r.receipt - r.payment; return { ...r, balance: bal }; });
}
async function buildBankBookRows() {
  const s = window.APP_SETTINGS;
  const isBankMode = (m) => m === 'Bank' || m === 'UPI';
  const [receipts, payments, transfers, loans, collections, payouts] = await Promise.all([
    activeReceipts(), activePayments(), allTransfers(), allLoans(), allChittyCollections(), allChittyPayouts()
  ]);
  const rows = [];
  receipts.filter(r=>isBankMode(r.paymentMode)).forEach(r => rows.push({ date:r.date, particulars:`Receipt ${r.receiptNo} - ${r.name} (${r.paymentMode})`, deposit:r.amount, withdrawal:0 }));
  payments.filter(p=>isBankMode(p.paymentMode)).forEach(p => rows.push({ date:p.date, particulars:`Payment ${p.voucherNo} - ${p.paidTo} (${p.paymentMode})`, deposit:0, withdrawal:p.amount }));
  loans.filter(l=>isBankMode(l.paymentMode)).forEach(l => { if (l.loanReceived) rows.push({ date:l.date, particulars:`Loan Received - ${l.person}`, deposit:l.loanReceived, withdrawal:0 }); if (l.repayment) rows.push({ date:l.date, particulars:`Loan Repayment - ${l.person}`, deposit:0, withdrawal:l.repayment }); });
  collections.filter(c=>isBankMode(c.paymentMode)).forEach(c => rows.push({ date:c.date, particulars:`Chitty Collection - ${c.memberName||''}`, deposit:c.amountReceived, withdrawal:0 }));
  payouts.filter(p=>isBankMode(p.paymentMode)).forEach(p => rows.push({ date:p.date, particulars:`Chitty Payout - ${p.memberName||''}`, deposit:0, withdrawal:p.amount }));
  transfers.forEach(t => {
    if (t.fromAcc==='Bank') rows.push({ date:t.date, particulars:`Withdrawal to Cash via ${t.mode||'Cash'}${t.reason?' ('+t.reason+')':''}${t.refNo?' - Ref '+t.refNo:''}`, deposit:0, withdrawal:t.amount });
    if (t.toAcc==='Bank') rows.push({ date:t.date, particulars:`Deposit from Cash via ${t.mode||'Cash'}${t.reason?' ('+t.reason+')':''}${t.refNo?' - Ref '+t.refNo:''}`, deposit:t.amount, withdrawal:0 });
  });
  rows.sort((a,b) => a.date.localeCompare(b.date));
  let bal = parseFloat(s.openingBank) || 0;
  return rows.map(r => { bal += r.deposit - r.withdrawal; return { ...r, balance: bal }; });
}

function applyLedgerFilter() {
  const from = el('ledgerFrom').value, to = el('ledgerTo').value, fund = el('ledgerFundFilter').value;
  qsa('#ledgerTable tbody tr').forEach(tr => {
    let show = true;
    if (from && tr.dataset.date < from) show = false;
    if (to && tr.dataset.date > to) show = false;
    if (fund && tr.dataset.fund !== fund) show = false;
    tr.style.display = show ? '' : 'none';
  });
}
function exportLedgerCSV() {
  const rows = [['Date','Voucher/Receipt No.','Particulars','Fund','Debit','Credit']];
  qsa('#ledgerTable tbody tr').forEach(tr => { if (tr.style.display !== 'none') rows.push(qsa('td', tr).map(td => td.textContent)); });
  downloadCSV(rows, 'Ledger');
}

async function saveTransfer() {
  const fd = new FormData(el('transferForm'));
  const amount = parseFloat(fd.get('amount'));
  const editId = fd.get('editId') ? parseInt(fd.get('editId')) : null;
  if (fd.get('fromAcc') === fd.get('toAcc')) { alert('From and To accounts must be different.'); return; }
  if (!amount || amount <= 0) { alert('Enter a valid amount.'); return; }
  const rec = { date: fd.get('date'), fromAcc: fd.get('fromAcc'), toAcc: fd.get('toAcc'), mode: fd.get('mode') || 'Cash', amount, reason: fd.get('reason')||'', refNo: fd.get('refNo')||'' };
  if (editId) {
    const prior = await getOne('transfers', editId);
    rec.createdAt = prior ? prior.createdAt : Date.now();
    rec.id = editId;
    await putRec('transfers', rec);
  } else {
    rec.createdAt = Date.now();
    await addRec('transfers', rec);
  }
  await navigate('transfers');
}

/* ===================== TRIAL BALANCE ===================== */
VIEW_RENDERERS.trialbalance = async function() {
  const [receipts, payments, cash, bank, funds, loanOut] = await Promise.all([
    activeReceipts(), activePayments(), getCashBalance(), getBankBalance(), getAllFundBalances(), getLoanOutstanding()
  ]);
  const incomeByCategory = {};
  receipts.forEach(r => { const cat = r.category || 'Uncategorized'; incomeByCategory[cat] = (incomeByCategory[cat]||0) + r.amount; });
  const expenseByCategory = {};
  payments.forEach(p => { const cat = p.category || 'Uncategorized'; expenseByCategory[cat] = (expenseByCategory[cat]||0) + p.amount; });

  /* Balance-sheet style rows only (Cash/Bank/Funds/Loans). Income & Expense category
     totals are NOT added here as separate rows: every receipt/payment amount is already
     reflected inside Cash/Bank (asset) and its Fund (equity) balance, so also listing the
     category amount as its own debit/credit would count the same amount twice ("multiplied")
     and throw the trial balance out of balance. Category-wise figures are shown below instead,
     as a reference-only Income & Expenditure summary that is not part of this balance check. */
  const rows = [];
  rows.push({ account: 'Cash in Hand', debit: cash, credit: 0 });
  rows.push({ account: 'Bank Account', debit: bank, credit: 0 });
  funds.forEach(f => rows.push({ account: f.name + ' (Fund)', debit: 0, credit: f.balance }));
  if (loanOut) rows.push({ account: 'Loans Payable', debit: 0, credit: loanOut });

  const totalDebit = sumField(rows, 'debit'), totalCredit = sumField(rows, 'credit');
  const balanced = Math.abs(totalDebit - totalCredit) < 0.01;

  const totalIncome = Object.values(incomeByCategory).reduce((a,b)=>a+b,0);
  const totalExpense = Object.values(expenseByCategory).reduce((a,b)=>a+b,0);

  return `
    <div class="balance-banner ${balanced?'ok':'bad'}">${balanced ? '✅ Accounts Balanced' : `⚠️ Difference Found: ${fmtMoney(Math.abs(totalDebit-totalCredit))}`}</div>
    <p class="muted">This is a simplified trial balance built from cash/bank, fund and loan balances — a full double-entry journal is planned for a future update.</p>
    <div class="table-wrap"><table>
      <thead><tr><th>Account</th><th>Debit</th><th>Credit</th></tr></thead>
      <tbody>
        ${rows.map(r=>`<tr><td>${esc(r.account)}</td><td>${r.debit?fmtMoney(r.debit):'-'}</td><td>${r.credit?fmtMoney(r.credit):'-'}</td></tr>`).join('')}
        <tr class="pr-bold"><td><b>TOTAL</b></td><td><b>${fmtMoney(totalDebit)}</b></td><td><b>${fmtMoney(totalCredit)}</b></td></tr>
      </tbody>
    </table></div>

    <h3 style="margin-top:20px;color:var(--maroon);">Income &amp; Expenditure by Category (reference only)</h3>
    <p class="muted">Shown for information — already included inside the Fund and Cash/Bank balances above, so not added into the Trial Balance totals.</p>
    <div class="panel-row">
      <div class="panel">
        <h3>Income</h3>
        <div class="table-wrap"><table>
          <tbody>
            ${Object.entries(incomeByCategory).map(([cat,amt])=>`<tr><td>${esc(cat)}</td><td>${fmtMoney(amt)}</td></tr>`).join('') || '<tr><td class="muted">No income recorded</td><td></td></tr>'}
            <tr class="pr-bold"><td><b>Total Income</b></td><td><b>${fmtMoney(totalIncome)}</b></td></tr>
          </tbody>
        </table></div>
      </div>
      <div class="panel">
        <h3>Expense</h3>
        <div class="table-wrap"><table>
          <tbody>
            ${Object.entries(expenseByCategory).map(([cat,amt])=>`<tr><td>${esc(cat)}</td><td>${fmtMoney(amt)}</td></tr>`).join('') || '<tr><td class="muted">No expense recorded</td><td></td></tr>'}
            <tr class="pr-bold"><td><b>Total Expense</b></td><td><b>${fmtMoney(totalExpense)}</b></td></tr>
          </tbody>
        </table></div>
      </div>
    </div>
  `;
};

VIEW_RENDERERS.backup = async function() {
  return `
    <div class="panel-row">
      <div class="panel">
        <h3>💾 Backup Data</h3>
        <p class="muted">Download a full JSON backup of every record in this application. Keep it somewhere safe.</p>
        <button class="btn-green" onclick="downloadBackup()">DOWNLOAD BACKUP (JSON)</button>
      </div>
      <div class="panel">
        <h3>♻️ Restore Data</h3>
        <p class="muted">Restoring replaces ALL current data in this application with the contents of the backup file.</p>
        <input type="file" id="restoreFile" accept="application/json">
        <div style="margin-top:10px;"><button class="btn-danger" onclick="restoreBackup()">RESTORE FROM FILE</button></div>
      </div>
    </div>
    <div class="panel" style="margin-top:16px;">
      <h3>⏰ Auto Backup Reminder</h3>
      <p class="muted">Remember to download a fresh backup regularly (e.g. weekly) since all data lives only in this browser's storage on this computer.</p>
    </div>
  `;
};
async function downloadBackup() {
  const dump = {};
  for (const name of STORES) dump[name] = await getAll(name);
  const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `Temple_Accounts_Backup_${todayISO()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function restoreBackup() {
  const file = el('restoreFile').files[0];
  if (!file) { alert('Choose a backup JSON file first.'); return; }
  if (!confirm('This will REPLACE all current data. Continue?')) return;
  const text = await file.text();
  let data;
  try { data = JSON.parse(text); } catch (e) { alert('Invalid JSON file.'); return; }
  for (const name of STORES) {
    await clearStore(name);
    const rows = data[name] || [];
    for (const row of rows) { try { await addRec(name, row); } catch (e) { await putRec(name, row); } }
  }
  await refreshSettings();
  if (!window.APP_SETTINGS) await seedIfNeeded();
  applyBrand();
  alert('Restore complete.');
  await navigate('dashboard');
}

/* ===================== CSV EXPORT ===================== */
function downloadCSV(rows, filenamePrefix) {
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${filenamePrefix}_${todayISO()}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function exportCSV(type) {
  if (type === 'receipts') {
    const list = await allReceipts();
    const rows = [['ReceiptNo','Date','Name','Mobile','Fund','Category','Description','PaymentMode','BankAccount','Amount','Remarks','Status']];
    list.forEach(r => rows.push([r.receiptNo, r.date, r.name, r.mobile, r.fund, r.category, r.description, r.paymentMode, r.bankAccount, r.amount, r.remarks, r.voided?'Voided':'Active']));
    downloadCSV(rows, 'Receipts');
  } else if (type === 'payments') {
    const list = await allPayments();
    const rows = [['VoucherNo','Date','PaidTo','Fund','Category','Description','PaymentMode','BankAccount','Amount','BillNo','Remarks','Status']];
    list.forEach(p => rows.push([p.voucherNo, p.date, p.paidTo, p.fund, p.category, p.description, p.paymentMode, p.bankAccount, p.amount, p.billNo, p.remarks, p.voided?'Voided':'Active']));
    downloadCSV(rows, 'Payments');
  }
}

/* ===================== GLOBAL SEARCH ===================== */
async function runGlobalSearch() {
  const q = el('globalSearch').value.trim().toLowerCase();
  if (!q) return;
  const [receipts, payments] = await Promise.all([allReceipts(), allPayments()]);
  const rMatches = receipts.filter(r => [r.receiptNo,r.name,r.mobile,r.category,r.fund,r.description,String(r.amount)].join(' ').toLowerCase().includes(q));
  const pMatches = payments.filter(p => [p.voucherNo,p.paidTo,p.category,p.fund,p.description,p.billNo,String(p.amount)].join(' ').toLowerCase().includes(q));
  const main = el('app-main');
  el('topbar-title').textContent = 'Search Results';
  qsa('.nav-item').forEach(b => b.classList.remove('active'));
  main.innerHTML = `
    <button class="btn-outline btn-sm" onclick="navigate('dashboard')">← Back to Dashboard</button>
    <div class="panel-row" style="margin-top:14px;">
      <div class="panel"><h3>Receipts (${rMatches.length})</h3>${simpleList(rMatches.map(r=>`${esc(r.receiptNo)} · ${fmtDate(r.date)} · ${esc(r.name)} — ${fmtMoney(r.amount)}`))}</div>
      <div class="panel"><h3>Payments (${pMatches.length})</h3>${simpleList(pMatches.map(p=>`${esc(p.voucherNo)} · ${fmtDate(p.date)} · ${esc(p.paidTo)} — ${fmtMoney(p.amount)}`))}</div>
    </div>
  `;
}

/* ===================== NAV WIRING & BOOT ===================== */
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.nav-item');
  if (btn) navigate(btn.dataset.view);
});
window.navigate = navigate;

async function boot() {
  await openDB();
  await seedIfNeeded();
  applyBrand();
  await navigate('dashboard');
}
boot();
